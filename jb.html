<!doctype html>

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
   <title>R-GAMER'S EXPLOIT 13.52</title>
<style>
  html, body {
    margin:0;
    padding:0;
    min-height:100%;
    background:#0b0d10 url("fondo.jpg") center center / cover no-repeat fixed;
    color:#c8ced8;
    font:15px/1.45 "Segoe UI", system-ui, sans-serif;
  }

  body {
    min-height:100vh;
  }
  #brand { font-size:17px; text-align:center; padding:8px 10px; background:transparent; }
  #brand img { width:100px; height:100px; margin-right:8px; border-radius:0%;
               vertical-align:middle; }
  #brand b { font-size:30px; font-weight:700; letter-spacing:.2em;
             color:#e6ebf2; vertical-align:middle; text-align:center }
  #brandd { font-size:30px; font-weight:700; letter-spacing:.14em;
             color:0e1116; background:#transparent;  text-align:center;}
  #brandS { text-align:center; font-size:11px; letter-spacing:.1em; padding:px 16px; background:transparent;
           border-bottom:1px solid #1e2732; }
  #brandA { font-size:13px; font-weight:700; letter-spacing:.5em;
             color:0e1116; background:transparent;  text-align:center; }

      /* running: a spinner under the brand. jb.js sets body.done / body.fail / body.log. */
      #spin {
        position: fixed;
        top: calc(50% + 60px);
        left: 50%;
        width: 46px;
        height:46px;
        margin: -23px 0 0 -23px;
        border: 3px solid #1e2732;
        border-top-color: #7fd0a0;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 16px;
        letter-spacing: 0.5px;
        display: none;
      }
      #wrap {
        padding: 0;
      }
      #state,
      #out {
        display: none;
      }

      body.done #spin {
        display: none;
      }
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }

      /* ?log=1 -- the full step log, styled like the landing. */
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 14px 18px;
      }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font:
          12px/1.45 Consolas,
          monospace;
        background: #11151b;
        border: 1px solid #1e2732;
        border-radius: 5px;
        padding: 10px 12px;
        height: calc(100vh - 141px);
        overflow-y: auto;
      }
      .ok {
        color: #7fd0a0;
      }
      .bad {
        color: #d08a7f;
      }
      .warn {
        color: #d8c07f;
      }
      .safe {
        color: #7fd0a0;
      }
      .danger {
        color: #d08a7f;
      }
      code {
        color: #9fb3d0;
      }
      #warn {
        padding: 14px 12px;
        background: #3a0f10;
        color: #ffdede;
        border-bottom: 2px solid #a5202a;
        text-align: center;
        font-weight: 900;
        font-size: 17px;
        letter-spacing: 0.08em;
        line-height: 1.35;
        text-transform: uppercase;
        text-shadow: 0 0 6px rgba(255, 60, 60, 0.45);
        animation: warnpulse 1.6s ease-in-out infinite;
      }
      #warn b { color: #ff5666; font-size: 19px; }
      @keyframes warnpulse {
        0%, 100% { background: #3a0f10; }
        50%      { background: #5a1418; }
      }
      #foot {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 6px;
        text-align: center;
        font-size: 12px;
        color: #5c6672;
        letter-spacing: 0.06em;
        pointer-events: none;
        line-height: 1.5;
      }
      #foot b {
        color: #8b95a3;
        font-weight: 600;
      }
      #foot a {
        color: #7fa0c6;
        text-decoration: none;
        pointer-events: auto;
      }
      #foot .hint {
        color: #4c5560;
        font-style: italic;
        margin-left: 4px;
      }
    </style>
  </head>
  <body>
<div id="brand"><img src="logo_raw.png" alt="" width="28" height="28"></div>
<div id="brandd"><b>R-GAMER'S</b></div>
<div id="brandA"><b>JIGUANI - MANZANILLO</b></div>
<div id="brandA"><b>52072114  -  55064378  -  59511352</b></div>
<div id="brandS"><b>PS4 EXPLOIT 11.00 - 13.52</b></div>
    <div id="warn">⚠ ESTE GOLDHEN es solo para version <b>13.52</b> ⚠</div>
    <div id="spin"></div>
    <div id="msg">Reinicia tu consola</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script type="module">
      import "./jb.js?v=10";
    </script>
    <div id="foot">
  TALLER <b>R-GAMER'S</b> &middot;

    </div>
  </body>
</html>
